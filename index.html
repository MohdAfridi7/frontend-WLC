<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- =========================================
         VIEWPORT
    ========================================== -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- =========================================
         FAVICON
         public/Clinifia 32 x 32.png
    ========================================== -->
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/Clinifia%2032%20x%2032.png"
    />

    <!-- Apple / Mobile Icon -->
    <link
      rel="apple-touch-icon"
      href="/Clinifia%2032%20x%2032.png"
    />

    <!-- =========================================
         BASIC SEO
    ========================================== -->
    <title>World Leader Consortium</title>

    <meta
      name="description"
      content="World Leader Consortium"
    />

    <meta
      name="robots"
      content="index, follow"
    />

    <!-- =========================================
         OPEN GRAPH
         WhatsApp / Facebook / LinkedIn
    ========================================== -->
    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:site_name"
      content="World Leader Consortium"
    />

    <meta
      property="og:title"
      content="World Leader Consortium"
    />

    <meta
      property="og:description"
      content="World Leader Consortium"
    />

    <meta
      property="og:url"
      content="https://YOUR-DOMAIN.com/"
    />

    <meta
      property="og:image"
      content="https://YOUR-DOMAIN.com/Clinifia%201200%20x%20630.png"
    />

    <meta
      property="og:image:width"
      content="1200"
    />

    <meta
      property="og:image:height"
      content="630"
    />

    <meta
      property="og:image:type"
      content="image/png"
    />

    <meta
      property="og:image:alt"
      content="World Leader Consortium"
    />

    <!-- =========================================
         X / TWITTER
    ========================================== -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="World Leader Consortium"
    />

    <meta
      name="twitter:description"
      content="World Leader Consortium"
    />

    <meta
      name="twitter:image"
      content="https://YOUR-DOMAIN.com/Clinifia%201200%20x%20630.png"
    />

    <meta
      name="twitter:image:alt"
      content="World Leader Consortium"
    />

    <!-- =========================================
         GOOGLE FONTS
    ========================================== -->
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"

    />

    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;700&display=swap"
